[package]
name = "edge-probe"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "control-plane"
path = "src/bin/control_plane.rs"

[[bin]]
name = "edge-probe"
path = "src/bin/edge_probe.rs"

[[bin]]
name = "kms"
path = "src/bin/kms.rs"

[[bin]]
name = "l2-dump"
path = "src/bin/l2_dump.rs"

[[bin]]
name = "udp-sim"
path = "src/bin/udp_sim.rs"

[dependencies]
anyhow.workspace = true
axum.workspace = true
bytes.workspace = true
chrono.workspace = true
clap.workspace = true
console-subscriber.workspace = true
etherparse.workspace = true
futures.workspace = true
hex.workspace = true
if-addrs.workspace = true
libc = "0.2.191"
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
netdev.workspace = true
pcap.workspace = true
pnet.workspace = true
rand.workspace = true
reqwest.workspace = true
rtp-parser.workspace = true
serde.workspace = true
serde_json.workspace = true
socket2.workspace = true
sqlx.workspace = true
syslog-tracing.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
webrtc-srtp.workspace = true
zerocopy.workspace = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tokio_unstable)'] }
async_fn_in_trait = "allow"
unused_variables = "allow"
dead_code = "allow"
unused_imports = "allow"

[dev-dependencies]
turmoil.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
tokio-uring.workspace = true
