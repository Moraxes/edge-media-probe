[package]
name = "rtp-parser"
version = "0.1.0"
edition = "2024"
description = "Lekki, zero-copy parser i demultiplekser pakietów RTP/RTCP (RFC 3550, RFC 5761)"


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tokio_unstable)'] }

[dependencies]
bytes.workspace = true
thiserror.workspace = true

[dev-dependencies]
criterion.workspace = true
rtp.workspace = true
webrtc-util.workspace = true

[[bench]]
name = "bytes_false_sharing"
harness = false
