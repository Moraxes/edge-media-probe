global:
  scrape_interval: 1s
  evaluation_interval: 1s

scrape_configs:
  - job_name: "edge-media-probe"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["host.docker.internal:3000"]
        labels:
          app: "edge-media-probe"
          service: "control_plane"
      - targets: ["host.docker.internal:3002"]
        labels:
          app: "edge-media-probe"
          service: "edge_probe"

