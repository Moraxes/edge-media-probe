global:
  scrape_interval: 1s
  evaluation_interval: 1s

scrape_configs:
  - job_name: "edge-media-probe"
    metrics_path: "/metrics"
    static_configs:
      # host.docker.internal pozwala kontenerowi sięgnąć do serwera Axum działającego na maszynie hosta (port 3000)
      - targets: ["host.docker.internal:3000"]
        labels:
          app: "edge-media-probe"
          environment: "workshop"

